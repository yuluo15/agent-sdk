spring.application.name=agent-core-lab
spring.main.web-application-type=none

agent.limits.max-model-requests=16
agent.limits.max-tool-calls=30
agent.limits.model-timeout=60s
agent.limits.active-timeout=300s
agent.limits.max-context-tokens=32768
agent.limits.output-token-reserve=4096
agent.limits.max-repeated-tool-calls=3
agent.limits.max-consecutive-tool-errors=3
agent.limits.max-tool-result-bytes=16384

agent.cli.enabled=false
agent.cli.scenario=file-inspection
agent.model.enabled=false
logging.level.org.springframework.ai.openai.OpenAiChatModel=OFF

agent.workspace.input-root=./workspace/input
agent.workspace.output-root=./workspace/output
agent.workspace.trace-root=./workspace/traces
